[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowcode"
version = "0.27.0"
description = "Shadowcode — an original CLI AI agent, built from scratch"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
browser = ["playwright"]
test = ["pytest"]

[project.scripts]
shadowcode = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["shadowcode_pkg"]
